plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.bongocat'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bongocat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Kotlin 1.8+ 已把 jdk7/jdk8 的类合并进 kotlin-stdlib,
// 老的 kotlin-stdlib-jdk7/jdk8 会和新版 stdlib 产生重复类,这里统一排除。
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}